<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>색상 시안 비교</title>
<style>
  :root { --bg: #f2f4f7; --card: #fff; --line: #d5dce5; --text: #1b2430; --muted: #5d6b7c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; padding: 18px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 1.1rem; margin: 0 0 2px; }
  .card .desc { color: var(--muted); font-size: .88rem; margin: 0 0 8px; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 11; overflow: hidden; border-radius: 6px; border: 1px solid var(--line); }
  .frame iframe { position: absolute; top: 0; left: 0; width: 200%; height: 200%; border: 0; transform: scale(.5); transform-origin: 0 0; }
  .card a { font-size: .88rem; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>색상 시안 비교</h1>
  <p class="lead">시안 B(주간 라이트)를 바탕으로 단추·탭에 색을 넣은 시안입니다. 녹화된 시연 화면에 적용했습니다(분석 서버 호출 없음). 화면 안에서 스크롤할 수 있고, "크게 보기"로 실제 크기를 볼 수 있습니다.</p>
  <div class="grid" id="grid"></div>
<script>
  const T = [
    ["b", "시안 B · 주간 라이트 (단추 기본)", "지난번 시안 B: 단추가 연한 회색"],
    ["b1", "시안 B-1 · 파랑 단추", "일반 단추는 파랑, 분석 시작은 초록, 선택된 큰 탭도 파랑. 반영이 필요할 때 단추가 주황으로 바뀜"],
    ["b2", "시안 B-2 · 초록 연한 단추", "군 초록 계열로 통일: 연한 초록 단추 + 진한 초록 분석 시작, 큰 탭은 초록 상자. 반영 필요 시 노랑"],
    ["b3", "시안 B-3 · 역할별 색 단추", "반영=파랑, ISR 추가=보라, 분석 시작=초록, 저장·내려받기=청록, 비우기=빨강 테두리. 큰 탭도 탭마다 색"],
  ];
  document.getElementById("grid").innerHTML = T.map(([k, name, desc]) => {
    const url = "./?replay" + (k ? "&theme=" + k : "");
    return `<div class="card"><h2>${name}</h2><p class="desc">${desc}</p>
      <div class="frame"><iframe src="${url}" title="${name}"></iframe></div>
      <a href="${url}" target="_blank" rel="noopener">크게 보기 →</a></div>`;
  }).join("");
</script>
</body>
</html>
